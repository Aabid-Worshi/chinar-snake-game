<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chinar Snake Game</title>
    <style>
        body {
            background: linear-gradient(135deg, #111424, #060913);
            color: #fff;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 1.8rem;
            margin: 5px 0;
            color: #ffaa00; 
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
        }

        p {
            color: #8a99ad;
            font-size: 0.85rem;
            margin: 0 0 10px 0;
        }

        .game-info {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 25px;
            border-radius: 50px;
            margin-bottom: 10px;
        }

        #scoreBoard {
            font-size: 1.3rem;
            margin: 0;
            color: #ff4500; 
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }

        canvas {
            background-color: #0d111d;
            display: block;
            border-radius: 12px;
            border: 3px solid #ffaa00;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.2);
            max-width: 90vw;
            max-height: 38vh;
        }

        /* --- ARROW KEYPAD STYLING --- */
        .keypad-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .keypad-row {
            display: flex;
            justify-content: center;
        }

        .arrow-key {
            width: 55px;
            height: 50px;
            margin: 4px;
            background: linear-gradient(180deg, #22293a, #151a26);
            border: 2px solid #ffaa00;
            border-radius: 8px;
            color: #ffaa00;
            font-size: 1.4rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #996600, 0 0 10px rgba(255, 170, 0, 0.2);
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.05s ease;
        }

        .arrow-key:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #996600, 0 0 15px #ffaa00;
            background: #ffaa00;
            color: #0d111d;
        }

        .credits {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>🍁 Chinar Snake Game</h1>
    <p>PC: Keyboard/Mouse Arrow Keys | Mobile: Screen Buttons</p>
    
    <div class="game-info">
        <h2 id="scoreBoard">Score: 0</h2>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Keypad Layout -->
    <div class="keypad-container">
        <div class="keypad-row">
            <div class="arrow-key" id="keyUp">▲</div>
        </div>
        <div class="keypad-row">
            <div class="arrow-key" id="keyLeft">◀</div>
            <div class="arrow-key" id="keyDown">▼</div>
            <div class="arrow-key" id="keyRight">▶</div>
        </div>
    </div>

    <div class="credits">Designed by Aabid Hussain</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const box = 20; 
        let snake = [{ x: 10 * box, y: 10 * box }]; 
        let food = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };
        let score = 0;
        let d = "RIGHT"; 

        // 1. Fixed PC Keyboard Controls
        document.addEventListener("keydown", direction);
        function direction(event) {
            if (event.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if (event.keyCode == 38 && d != "DOWN") d = "UP";
            else if (event.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if (event.keyCode == 40 && d != "UP") d = "DOWN";
        }

        // Functions to change directions safely
        function moveUp() { if(d != "DOWN") d = "UP"; }
        function moveDown() { if(d != "UP") d = "DOWN"; }
        function moveLeft() { if(d != "RIGHT") d = "LEFT"; }
        function moveRight() { if(d != "LEFT") d = "RIGHT"; }

        // 2. Fixed Mobile Touch Controls
        document.getElementById("keyUp").addEventListener("touchstart", (e) => { moveUp(); });
        document.getElementById("keyDown").addEventListener("touchstart", (e) => { moveDown(); });
        document.getElementById("keyLeft").addEventListener("touchstart", (e) => { moveLeft(); });
        document.getElementById("keyRight").addEventListener("touchstart", (e) => { moveRight(); });
        
        // 3. PC Mouse Click Controls
        document.getElementById("keyUp").addEventListener("click", moveUp);
        document.getElementById("keyDown").addEventListener("click", moveDown);
        document.getElementById("keyLeft").addEventListener("click", moveLeft);
        document.getElementById("keyRight").addEventListener("click", moveRight);

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function drawChinarLeaf(x, y, size) {
            ctx.save();
            ctx.translate(x + size / 2, y + size / 2);
            ctx.fillStyle = "#ff4500"; 
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff4500";

            ctx.beginPath();
            ctx.moveTo(0, -size / 2);
            ctx.lineTo(size / 4, -size / 4);
            ctx.lineTo(size / 2, -size / 6);
            ctx.lineTo(size / 3, size / 8);
            ctx.lineTo(size / 2, size / 3);
            ctx.lineTo(size / 6, size / 4);
            ctx.lineTo(0, size / 2); 
            ctx.lineTo(-size / 6, size / 4);
            ctx.lineTo(-size / 2, size / 3);
            ctx.lineTo(-size / 3, size / 8);
            ctx.lineTo(-size / 2, -size / 6);
            ctx.lineTo(-size / 4, -size / 4);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = "#0d111d";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Fixed Snake Rendering Bug
            for (let i = 0; i < snake.length; i++) {
                if (i == 0) {
                    ctx.fillStyle = "#00ffcc"; 
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = "#00ffcc";
                } else {
                    ctx.fillStyle = "#00b3ff"; 
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = "#00b3ff";
                }
                ctx.beginPath();
                ctx.roundRect(snake[i].x + 1, snake[i].y + 1, box - 2, box - 2, 5);
                ctx.fill();
            }

            drawChinarLeaf(food.x, food.y, box);
            ctx.shadowBlur = 0; 

            let snakeX = snake[0].x; // Fixed array reference bug
            let snakeY = snake[0].y;

            if (d == "LEFT") snakeX -= box;
            if (d == "UP") snakeY -= box;
            if (d == "RIGHT") snakeX += box;
            if (d == "DOWN") snakeY += box;

            if (snakeX < 0) snakeX = canvas.width - box;
            if (snakeX >= canvas.width) snakeX = 0;
            if (snakeY < 0) snakeY = canvas.height - box;
            if (snakeY >= canvas.height) snakeY = 0;

            let newHead = { x: snakeX, y: snakeY };

            if (snakeX == food.x && snakeY == food.y) {
                score++;
                document.getElementById("scoreBoard").innerText = "Score: " + score;
                food = {
                    x: Math.floor(Math.random() * 20) * box,
                    y: Math.floor(Math.random() * 20) * box
                };
            } else {
                snake.pop(); 
            }

            if (collision(newHead, snake)) {
                clearInterval(game);
                alert("Game Over! Aapka Score: " + score);
                location.reload(); 
            }

            snake.unshift(newHead);
        }

        let game = setInterval(draw, 220); 
    </script>
</body>
</html>
